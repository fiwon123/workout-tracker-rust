services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workout_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-workout_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout -d workout_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      LISTEN_ADDR: 0.0.0.0:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-workout}:${POSTGRES_PASSWORD:-workout_dev_password}@db:5432/${POSTGRES_DB:-workout_tracker}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      
volumes:
  postgres_data: